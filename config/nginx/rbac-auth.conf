# klipper-rbac-gateway — nginx snippet
# Included at the top of Mainsail's "server { ... }" block, e.g.:
#     server {
#         include /etc/nginx/rbac-auth.conf;
#         ...
#
# Every request (Mainsail files, API, websocket, webcam) is first checked
# against the gateway. Without a valid session the browser is sent to the login page.

auth_request /_rbac/auth;
error_page 401 = @rbac_login;

location @rbac_login {
    return 302 /_rbac/login;
}

# Session check used by auth_request (internal only).
location = /_rbac/auth {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:7200/_rbac/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# Login page, logout, user management API and ui.js.
location /_rbac/ {
    auth_request off;
    proxy_pass http://127.0.0.1:7200;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Injects the "Users" tab script into Mainsail's index.html (requires ngx_http_sub_module).
sub_filter '</body>' '<script src="/_rbac/ui.js" defer></script></body>';
sub_filter_once on;
